<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>SmartThings Device</title>

    <link href="../utils/bootstrap-icons.css" rel="stylesheet">
    <link href="../utils/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="sdpi-wrapper p-3">

    <h5 class="mb-3">SmartThings</h5>

    <button
        id="connect"
        class="btn btn-primary w-100 mb-3">
        SmartThings 연결
    </button>

    <div class="mb-3">
        <label class="form-label">연결 상태</label>

        <input
            type="text"
            id="status"
            class="form-control"
            value="연결되지 않음"
            readonly
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Device</label>

        <select
            id="device"
            class="form-select"
            disabled>
            <option value="">먼저 SmartThings에 연결하세요</option>
        </select>
    </div>

    <button
        id="refresh"
        class="btn btn-secondary w-100"
        disabled>
        기기 새로고침
    </button>

</div>

<script src="../utils/common.js"></script>
<script src="../utils/action.js"></script>
<script src="../utils/axios.js"></script>
<script src="index.js"></script>

</body>

<style>
body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    padding: 8px;
    background-color: #2a2a2a;
    color: #fff;
}

::-webkit-scrollbar {
    display: none;
}
</style>

</html>
